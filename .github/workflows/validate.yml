name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Smoke-check app shell and branded assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const file of ['styles.css', 'app.js', 'logo.svg', 'manifest.webmanifest', 'sw.js']) {
            if (!fs.existsSync(file)) throw new Error('Missing app asset: ' + file);
          }
          for (const marker of ['href="styles.css"', 'src="logo.svg"', 'href="manifest.webmanifest"', 'data-export="png"', 'data-export="jpg"', 'data-export="webp"', 'data-export="svg"', 'data-export="project"', 'id="transparentBg"']) {
            if (!html.includes(marker)) throw new Error('Missing HTML feature marker: ' + marker);
          }
          const logo = fs.readFileSync('logo.svg', 'utf8');
          if (!logo.includes('<svg') || !logo.includes('Universal Graphics Designer')) throw new Error('Logo SVG is invalid or unbranded.');
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const app = fs.readFileSync('app.js', 'utf8');
          for (const marker of ['blendMode', 'function exportRaster', 'gradient_${o.id}', 'shadow_${o.id}', 'state.transparent']) {
            if (!app.includes(marker)) throw new Error('Missing editor feature marker: ' + marker);
          }
          console.log('App shell, export controls, transparency, blend modes, SVG effects, logo, manifest and offline worker checks passed.');
          NODE
