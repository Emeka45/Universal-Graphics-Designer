<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Graphics Designer</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div class="brand"><span class="logo">U</span><div><small>UNIVERSAL</small><h1>Graphics Designer</h1></div></div><button id="download" class="primary">Export PNG</button></header><main><aside><h3>Design tools</h3><button data-tool="text">T Text</button><button data-tool="rect">▣ Shape</button><button data-tool="circle">● Circle</button><button data-tool="image">▧ Add image</button><hr><label>Canvas size<select id="size"><option value="1080x1080">Square 1080×1080</option><option value="1080x1350">Portrait 1080×1350</option><option value="1920x1080">Landscape 1920×1080</option></select></label><input id="img" type="file" accept="image/*" hidden></aside><section class="workspace"><div class="toolbar"><button id="clear">Clear</button><span id="hint">Tap a tool, then tap the canvas.</span></div><canvas id="canvas" width="1080" height="1080"></canvas></section></main></div><script src="app.js"></script></body></html>
